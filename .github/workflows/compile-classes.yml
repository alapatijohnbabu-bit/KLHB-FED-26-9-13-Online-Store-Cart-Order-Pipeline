name: Compile weekly Java classes

on:
  push:
    branches: [main]
    paths:
      - "src/Week */**.java"
      - ".github/workflows/compile-classes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile weekly Java files
        run: |
          mkdir -p bin
          javac -encoding UTF-8 -d bin src/Week\ */StoreWeek*.java
      - name: Commit compiled class files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bin/*.class
          if ! git diff --cached --quiet; then
            git commit -m "Compile weekly Java class files"
            git push
          fi
